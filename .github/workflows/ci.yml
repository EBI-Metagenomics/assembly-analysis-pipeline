name: CI
# This workflow runs the pipeline with the minimal test dataset to check that it completes without any syntax errors
on:
  push:
    branches:
      - dev
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Run pipeline with test data (${{ matrix.NXF_VER }} | ${{ matrix.test_name }} | ${{ matrix.profile }})"
    # Only run on push if this is the nf-core dev branch (merged PRs)
    if: "${{ github.event_name != 'push' || (github.event_name == 'push' && github.repository == 'ebi-metagenomics/assembly-analysis-pipeline') }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        NXF_VER:
          - "24.10.3"
        profile:
          - "docker"
          - "singularity"
        test_name:
          - "test_full"
        isMaster:
          - ${{ github.base_ref == 'main' }}
        # Exclude singularity on dev
        exclude:
          - isMaster: false
            profile: "singularity"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          install-pdiff: true

      - name: Set up Apptainer
        if: matrix.profile == 'singularity'
        uses: eWaterCycle/setup-apptainer@main

      - name: Set up Singularity
        if: matrix.profile == 'singularity'
        run: |
          mkdir -p $NXF_SINGULARITY_CACHEDIR
          mkdir -p $NXF_SINGULARITY_LIBRARYDIR

      - name: Run nf-test
        shell: bash
        env:
          NFT_WORKDIR: "~"
        run: |
          nf-test test tests/ \
            --profile=+${{ matrix.profile }} \
            --ci \
            --verbose \
            --tap=test.tap

            # Save the absolute path of the test.tap file to the output
            echo "tap_file_path=$(realpath test.tap)" >> $GITHUB_OUTPUT

      - name: Generate test summary
        if: always()
        shell: bash
        run: |
          # Add header if it doesn't exist (using a token file to track this)
          if [ ! -f ".summary_header" ]; then
            echo "# nf-test results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Status | Test Name | Profile |" >> $GITHUB_STEP_SUMMARY
            echo "|:------:|-----------|---------|" >> $GITHUB_STEP_SUMMARY
            touch .summary_header
          fi

          if [ -f test.tap ]; then
            while IFS= read -r line; do
              if [[ $line =~ ^ok ]]; then
                test_name="${line#ok }"
                # Remove the test number from the beginning
                test_name="${test_name#* }"
                echo "| ✅ | ${test_name} | ${{ matrix.profile }} |" >> $GITHUB_STEP_SUMMARY
              elif [[ $line =~ ^not\ ok ]]; then
                test_name="${line#not ok }"
                # Remove the test number from the beginning
                test_name="${test_name#* }"
                echo "| ❌ | ${test_name} | ${{ matrix.profile }} |" >> $GITHUB_STEP_SUMMARY
              fi
            done < test.tap
          else
            echo "| ⚠️ | No test results found | ${{ matrix.profile }} |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Clean up
        if: always()
        shell: bash
        run: |
          sudo rm -rf /home/ubuntu/tests/

  test-modules-local:
    name: "Run local module nf-tests"
    if: "${{ github.event_name != 'push' || (github.event_name == 'push' && github.repository == 'ebi-metagenomics/assembly-analysis-pipeline') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "24.10.3"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          install-pdiff: true

      - name: Run local module nf-tests
        shell: bash
        env:
          NFT_WORKDIR: "~"
        run: |
          nf-test test tests/modules/local \
            --profile=+docker \
            --ci \
            --verbose
